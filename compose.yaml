x-common-environment: &common-environment
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://tomoshibiyori:tomoshibiyori@db:5432/tomoshibiyori}
  MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-alpha_vantage}
  JQUANTS_PLAN: ${JQUANTS_PLAN:-light}
  MARKET_SCREENING_LIMIT: ${MARKET_SCREENING_LIMIT:-500}
  NOTIFICATION_DRY_RUN: ${NOTIFICATION_DRY_RUN:-true}

x-stock-signal: &stock-signal
  image: tomoshibiyori:local
  build:
    context: .
  volumes:
    - ./src:/app/src
    - ./tests:/app/tests
    - ./migrations:/app/migrations
    - ./alembic.ini:/app/alembic.ini:ro
    - ./data:/app/data:ro
    - ./models:/app/models
    - ./reports:/app/reports

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tomoshibiyori
      POSTGRES_USER: tomoshibiyori
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tomoshibiyori}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tomoshibiyori -d tomoshibiyori"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    <<: *stock-signal
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *common-environment
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *stock-signal
    environment:
      <<: *common-environment
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      JQUANTS_API_KEY: ${JQUANTS_API_KEY:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  batch:
    <<: *stock-signal
    command: ["stock-signal", "daily"]
    environment:
      <<: *common-environment
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      JQUANTS_API_KEY: ${JQUANTS_API_KEY:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *stock-signal
    environment:
      <<: *common-environment
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-6000}
      API_AUTH_REQUIRED: "true"
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-change-this-local-token-before-deploying}
    command:
      - uvicorn
      - stock_signal.web.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          request = urllib.request.Request('http://127.0.0.1:8000/api/v1/health');
          request.add_header('Authorization', 'Bearer ' + os.environ['INTERNAL_API_TOKEN']);
          urllib.request.urlopen(request, timeout=3)
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    image: tomoshibiyori-frontend:local
    build:
      context: ./frontend
      target: development
    command: ["pnpm", "dev", "--hostname", "0.0.0.0"]
    environment:
      FASTAPI_INTERNAL_URL: http://api:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-change-this-local-token-before-deploying}
      AUTH_SECRET: ${AUTH_SECRET:-change-this-auth-secret-before-deploying}
      AUTH_TRUST_HOST: "true"
      AUTH_ALLOW_INSECURE_LOCAL: ${AUTH_ALLOW_INSECURE_LOCAL:-true}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AUTH_ALLOWED_GITHUB_ID: ${AUTH_ALLOWED_GITHUB_ID:-}
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next-cache:/app/.next
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tomoshibiyori_test
      POSTGRES_USER: tomoshibiyori
      POSTGRES_PASSWORD: test-password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tomoshibiyori -d tomoshibiyori_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  test:
    <<: *stock-signal
    command: ["pytest"]
    environment:
      <<: *common-environment
      DATABASE_URL: postgresql+psycopg://tomoshibiyori:test-password@test-db:5432/tomoshibiyori_test
      TEST_DATABASE_URL: postgresql+psycopg://tomoshibiyori:test-password@test-db:5432/tomoshibiyori_test
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  postgres-data:
  frontend-node-modules:
  frontend-next-cache:
